name: Build Android APK (AutoHub PRO)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download & Setup Android SDK Commandline Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          rm -rf tools.zip cmdline-tools

      - name: Configure Android SDK Environment & Licenses
        run: |
          echo "export ANDROID_HOME=$HOME/android-sdk" >> $HOME/.bashrc
          echo "export PATH=\$PATH:\$ANDROID_HOME/cmdline-tools/latest/bin:\$ANDROID_HOME/platform-tools" >> $HOME/.bashrc
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Cordova Wrapper & Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          npm install -g cordova@12.0.0
          cordova create autohub_apk com.asifilyas.autohubpro "AutoHub PRO"
          cd autohub_apk
          rm -rf www/*
          cp ../index.html www/
          cp ../manifest.json www/ || true
          cp ../sw.js www/ || true
          cp ../icon-192.png www/ || true
          cp ../icon-512.png www/ || true
          cordova platform add android --nosave
          cordova build android --debug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoHub-PRO-Android-APK
          path: autohub_apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
