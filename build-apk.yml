name: Build Android APK (AutoHub PRO)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova WebView Wrapper Project
        run: |
          npm install -g cordova
          cordova create autohub_apk com.asifilyas.autohubpro "AutoHub PRO"
          cd autohub_apk
          rm -rf www/*
          cp ../index.html www/
          cp ../manifest.json www/ || true
          cp ../sw.js www/ || true
          cp ../icon-192.png www/ || true
          cp ../icon-512.png www/ || true
          cordova platform add android
          cordova build android --debug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoHub-PRO-Android-APK
          path: autohub_apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
